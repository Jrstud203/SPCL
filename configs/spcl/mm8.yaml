dataset: # Required.
  name: cardiac
  kwargs:
    root_dir: /home/zjj/semidata/MM/
    num_classes: 4
    labeled_num: 8 # 10%:7, 20%:14 100%: 170
    labeled_bs: 4  # 4
    batch_size: 8  # slice number 16
    batch_size_val: 1  # volume number
    num_workers: 0
#  noise_std: 0.1
#  crop_size: 224  # 513

ignore_label: 255
trainer: # Required.
#  epochs: 80
  max_iter: 6000
#  eval_on: True
  optimizer:
    type: SGD
    kwargs:
      lr: 0.01  # 4GPUs 0.001  | 0.01
      momentum: 0.9
      weight_decay: 0.0001  # 0.0001
  lr_scheduler:
    mode: poly
    kwargs:
      power: 0.9
  unsupervised:
    TTA: False
    drop_percent: 80
    apply_aug: cutmix
  sup_only_epoch: 1

saver:
  snapshot_dir: checkpoints
  pretrain: ''
#   auto_resume: True

criterion:
  type: CELoss
  kwargs:
    use_weight: False


net: # Required.
  num_classes: 4
  sync_bn: False  # True
  ema_decay: 0.999
  encoder:
    type: dgcl.models.resnet.resnet50  # dgcl.models.resnet.resnet101
    kwargs:
      multi_grid: True
      zero_init_residual: False
      fpn: True
      replace_stride_with_dilation: [False, False, True]  #layer0...1 is fixed, layer2...4
  decoder:
    type: dgcl.models.decoder.dec_deeplabv3_plus
    kwargs:
      inner_planes: 256
      dilations: [6, 12, 18]

metrics: # metrics config list
  Dice:
    name: Dice
    class_indexs: [ 0, 1, 2, 3 ]
    class_names: [ bg, c1, c2, c3 ]

  Jaccard:
    name: Jaccard
    class_indexs: [ 0, 1, 2, 3 ]
    class_names: [ bg, c1, c2, c3 ]

  HD95:
    name: HD95
    class_indexs: [ 0, 1, 2, 3 ]
    class_names: [ bg, c1, c2, c3 ]

  ASD:
    name: ASD
    class_indexs: [ 0, 1, 2, 3 ]
    class_names: [ bg, c1, c2, c3 ]
  

  
  